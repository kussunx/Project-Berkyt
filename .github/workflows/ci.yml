name: o1s source preflight

on:
  push:
    branches: [sixteen]
  pull_request:
    branches: [sixteen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Bash syntax, lint and o1s regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate modified build scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/make_rom.sh \
            platform/exynos2100/patches/eden/customize.sh \
            platform/exynos2100/patches/omx/customize.sh \
            platform/exynos2100/patches/stock_props/customize.sh \
            tests/o1s_patch_smoke.sh; do
            bash -n "$file"
          done
          shellcheck -S error -e SC1090,SC1091 \
            scripts/make_rom.sh \
            platform/exynos2100/patches/eden/customize.sh \
            platform/exynos2100/patches/omx/customize.sh \
            platform/exynos2100/patches/stock_props/customize.sh \
            tests/o1s_patch_smoke.sh
      - name: Run o1s patch smoke tests
        run: bash tests/o1s_patch_smoke.sh
